name: Deploy room installation
on:
  workflow_dispatch:
  push:
    branches: [deploy/room-pwa]
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: room-starter-pages
  cancel-in-progress: false
jobs:
  starter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || 'https://lexoniarus.github.io/aiko-desktop-pet/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download the reviewed installation site
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare_room_deployment.py
      - name: Check publication identity and current public files
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.check_room_deployment
      - uses: actions/configure-pages@v5
        if: steps.preflight.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.preflight.outputs.publish == 'true'
        id: upload
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist-room/published
      - name: Wait for the uploaded Pages artifact
        if: steps.preflight.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          for attempt in {1..12}; do
            sleep 5
            if [[ $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq ".artifacts[] | select(.id == $PAGES_ARTIFACT_ID and .expired == false and .size_in_bytes > 0) | .name") == "github-pages-$GITHUB_RUN_ATTEMPT" ]]; then
              echo "Pages artifact $PAGES_ARTIFACT_ID is available"
              exit 0
            fi
          done
          echo "::error::Uploaded Pages artifact $PAGES_ARTIFACT_ID did not become available"
          exit 1
      - name: Deploy starter
        if: steps.preflight.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify the public update and runtime
        run: python scripts/verify_room_deployment.py
