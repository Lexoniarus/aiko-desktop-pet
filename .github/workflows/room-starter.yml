name: Deploy room installation
on:
  workflow_dispatch:
  push:
    branches: [deploy/room-pwa]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: room-starter-pages
  cancel-in-progress: false
jobs:
  starter:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download the reviewed installation site
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare_room_deployment.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist-room/published
      - name: Deploy starter
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify the public update and runtime
        run: python scripts/verify_room_deployment.py
