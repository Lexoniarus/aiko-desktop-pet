name: Asset tooling and media

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests_tooling/**'
      - 'tools/**'
      - 'aiko_pet/assets/**'
      - 'aiko_pet/infrastructure/**'
      - 'aiko_pet/asset_paths.py'
      - 'aiko_pet/pet/animation/**'
      - 'vorschau/**'
      - 'LICENSES/**'
      - 'requirements.txt'
      - '.github/workflows/asset-tooling.yml'
  push:
    branches: [main]
    paths:
      - 'tests_tooling/**'
      - 'tools/**'
      - 'aiko_pet/assets/**'
      - 'aiko_pet/infrastructure/**'
      - 'aiko_pet/asset_paths.py'
      - 'aiko_pet/pet/animation/**'
      - 'vorschau/**'
      - 'LICENSES/**'
      - 'requirements.txt'
      - '.github/workflows/asset-tooling.yml'

permissions:
  contents: read

jobs:
  asset-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt Pillow==11.3.0
      - name: Check exporters and media
        run: python -m unittest discover -s tests_tooling -q
