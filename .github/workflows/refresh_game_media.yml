name: Capture and crop current Aiko preview gallery

on:
  push:
    branches:
      - main
      - fix/crop-aiko-preview-media
    paths:
      - tools/capture_current_gallery.py
      - tools/media_crop.py
      - tools/capture_rock_paper_scissors_media.py
      - .github/workflows/refresh_game_media.yml
      - aiko_pet/gui.py
      - aiko_pet/ui/**
      - aiko_pet/presentation/**
      - aiko_pet/assets/frames/**
      - aiko_pet/assets/animations.json
      - aiko_pet/assets/animation_timing.json

permissions:
  contents: write

jobs:
  capture:
    name: Fully framed Tk screenshots and stable animations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offscreen display and screenshot tool
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-xserver-utils python3-tk
          python -m pip install Pillow==11.3.0
      - name: Capture the actual desktop and minigame
        run: |
          xvfb-run -a -s "-screen 0 1366x900x24" sh -c 'xsetroot -solid "#202733" && python -m tools.capture_current_gallery && python -m tools.capture_rock_paper_scissors_media'
      - name: Remove obsolete preview imagery while keeping Git history
        run: |
          mkdir -p docs/references
          if [ -f vorschau/Kenney_SciFi_Sample_Referenz.png ]; then
            git mv vorschau/Kenney_SciFi_Sample_Referenz.png docs/references/Kenney_SciFi_Sample_Referenz.png
          fi
          git rm -f --ignore-unmatch -- vorschau/Aiko_v0_*.png vorschau/Aiko_v0_*.gif vorschau/Original-Animationen.gif vorschau/Aiko_Anime_Runtime.png
      - name: Commit actual refreshed screenshots and GIFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- vorschau docs/references
          if git diff --cached --quiet; then
            echo "The current gallery has not changed."
          else
            git commit -m "docs(media): refresh tightly framed current Aiko previews"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
