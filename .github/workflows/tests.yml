name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Ruff quality tool
        run: python -m pip install ruff==0.13.2
      - name: Run Ruff lint checks
        run: python -m ruff check aiko_pet tests main.py
      - name: Enforce PEP 8 line lengths in refactored domain
        run: |
          python -m ruff check --select E501 \
            aiko_pet/domain.py aiko_pet/friendship.py \
            aiko_pet/value_rules.py aiko_pet/care_actions.py \
            aiko_pet/need_decay.py aiko_pet/pet_lifecycle.py \
            tests/test_friendship_policy.py tests/test_care_actions.py \
            tests/test_pet_lifecycle.py
      - name: Enforce PEP 8 line lengths in adaptive and dialogue modules
        run: |
          python -m ruff check --select E501 \
            aiko_pet/adaptive.py aiko_pet/adaptive_policy.py \
            aiko_pet/dialogue.py aiko_pet/dialogue_events.py \
            aiko_pet/reaction_playback.py aiko_pet/movement.py \
            tests/test_adaptive_policy.py tests/test_dialogue_events.py \
            tests/test_spontaneous_events.py
      - name: Install static typing tool
        run: python -m pip install mypy==1.18.2
      - name: Type-check new headless core policies
        run: |
          python -m mypy --strict --follow-imports=silent \
            aiko_pet/adaptive_policy.py aiko_pet/dialogue_events.py \
            aiko_pet/movement.py aiko_pet/reaction_playback.py
      - name: Install whole-application typing dependencies
        run: python -m pip install mypy==1.18.2 pyright Pillow==11.3.0
      - name: Enforce strict typing across the entire application
        run: python -m mypy --strict --no-incremental aiko_pet main.py tools
      - name: Enforce repository-wide Pyright checks (including tests)
        run: python -m pyright --project pyrightconfig.json
      - name: Install graphical test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - name: Run all unit and GUI tests
        run: xvfb-run -a python -m unittest discover -s tests -q

  windows-smoke:
    name: Windows headless boundaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Import all desktop components on Windows
        run: python -c "import aiko_pet.gui, aiko_pet.desktop_input, aiko_pet.window_stack, aiko_pet.taskbar"
      - name: Check Windows desktop boundaries without opening GUI windows
        shell: pwsh
        run: |
          $patterns = @(
            "test_taskbar.py",
            "test_window_stack.py",
            "test_desktop_input.py",
            "test_gaze.py",
            "test_entrypoints_env.py",
            "test_storage.py",
            "test_motion_animation.py",
            "test_reaction_playback.py",
            "test_adaptive_policy.py",
            "test_dialogue_events.py",
            "test_spontaneous_events.py",
            "test_friendship_policy.py",
            "test_care_actions.py",
            "test_pet_lifecycle.py"
          )
          foreach ($pattern in $patterns) {
            python -m unittest discover -s tests -p $pattern -q
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
