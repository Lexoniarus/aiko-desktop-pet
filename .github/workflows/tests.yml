name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Ruff quality tool
        run: python -m pip install ruff==0.13.2
      - name: Run Ruff lint checks
        run: python -m ruff check aiko_pet tests main.py
      - name: Install graphical test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - name: Run all unit and GUI tests
        run: xvfb-run -a python -m unittest discover -s tests -q
