name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Ruff quality tool
        run: python -m pip install ruff==0.13.2
      - name: Enforce PEP 8, imports and naming across code and tests
        run: python -m ruff check aiko_pet tests main.py tools
      - name: Install static typing tool
        run: python -m pip install mypy==1.18.2
      - name: Type-check new headless core policies
        run: |
          python -m mypy --strict --follow-imports=silent \
            aiko_pet/pet/mind/adaptive_policy.py aiko_pet/pet/mind/click_policy.py \
            aiko_pet/pet/movement/controller.py aiko_pet/ui/pet_view/reaction_player.py
      - name: Install whole-application typing dependencies
        run: python -m pip install mypy==1.18.2 pyright==1.1.414 Pillow==11.3.0
      - name: Enforce strict typing across the entire application
        run: python -m mypy --strict --no-incremental aiko_pet main.py tools
      - name: Enforce repository-wide Pyright checks (including tests)
        run: python -m pyright --project pyrightconfig.json
      - name: Install graphical test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - name: Run all unit and GUI tests
        run: xvfb-run -a python -m unittest discover -s tests -q

  windows-smoke:
    name: Windows setup and desktop boundaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Install image test dependency
        run: python -m pip install Pillow==11.3.0
      - name: Import all desktop components on Windows
        run: python -c "import aiko_pet.gui, aiko_pet.desktop.global_input, aiko_pet.desktop.window_stack, aiko_pet.desktop.taskbar"
      - name: Check Windows setup and desktop boundaries
        shell: pwsh
        run: |
          $patterns = @(
            "test_cursor_behaviour*.py",
            "test_cursor_contact_origin.py",
            "test_cursor_experiences.py",
            "test_cursor_menu_access.py",
            "test_cursor_warning.py",
            "test_movement_requests.py",
            "test_idle_steps.py",
            "test_idle_behaviour.py",
            "test_idle_gesture.py",
            "test_body_orientation.py",
            "test_body_pose*.py",
            "test_character_body_pose_export.py",
            "test_cursor_front_pose.py",
            "test_animated_pet_isolation.py",
            "test_desktop_animation_runtime.py",
            "test_desktop_visual_observation.py",
            "test_desktop_input_controller.py",
            "test_world*.py",
            "test_object*.py",
            "test_german_object_phrases.py",
            "test_content_catalog.py",
            "test_pickup*.py",
            "test_goal_walk.py",
            "test_ground_approach.py",
            "test_consumption_origin.py",
            "test_food_gui.py",
            "test_food_rendering.py",
            "test_item_display_assets.py",
            "test_windows_setup.py",
            "test_taskbar.py",
            "test_character_assets.py",
            "test_active_time.py",
            "test_elapsed_time.py",
            "test_time_persistence.py",
            "test_need_mood_balance.py",
            "test_daily_need_schedules.py",
            "test_care_requests.py",
            "test_care_results.py",
            "test_assets.py",
            "test_window_stack.py",
            "test_desktop_input.py",
            "test_click_gui.py",
            "test_contact_coordinator.py",
            "test_desktop_boundary.py",
            "test_gaze.py",
            "test_entrypoints_env.py",
            "test_storage.py",
            "test_session_restoration.py",
            "test_offline_progress.py",
            "test_sleep*.py",
            "test_quiet_rhythm.py",
            "test_desktop_session_runtime.py",
            "test_resource_validation.py",
            "test_rock_paper_scissors_gui.py",
            "test_settings_model.py",
            "test_motion_animation.py",
            "test_reaction_playback.py",
            "test_adaptive_policy.py",
            "test_dialogue_events.py",
            "test_spontaneous_events.py",
            "test_friendship_policy.py",
            "test_friendship_neglect.py",
            "test_care_actions.py",
            "test_pet_lifecycle.py",
            "test_domain_transitions.py",
            "test_pet_mind_catalogue.py",
            "test_desktop_package_layout.py",
            "test_persistence_package.py",
            "test_final_architecture_audit.py",
            "test_dependency_graph.py",
            "test_public_repository.py",
            "test_workload_events.py",
            "test_application_core.py",
            "test_adaptive_models.py",
            "test_ui_architecture.py",
            "test_ui_projection_parity.py",
            "test_desktop_runtime.py",
            "test_desktop_walk_runtime.py",
            "test_desktop_preferences.py",
            "test_desktop_focus_timers.py",
            "test_desktop_persistence.py",
            "test_desktop_maintenance.py",
            "test_cursor_observation.py",
            "test_pointer_runtime.py",
            "test_desktop_attention_runtime.py",
            "test_character_mind_injection.py",
            "test_canonical_import_paths.py",
            "test_attention_policy.py",
            "test_hardware_providers.py",
            "test_system_activity.py",
            "test_desktop_lifecycle.py"
          )
          foreach ($pattern in $patterns) {
            python -m unittest discover -s tests -p $pattern -q
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
