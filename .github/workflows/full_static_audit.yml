name: Full Python static audit (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete-code-audit:
    name: Repository-wide type diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic tools
        run: python -m pip install mypy==1.18.2 pyright Pillow==11.3.0
      - name: Analyze entire application with Pyright
        run: python -m pyright --project pyrightconfig.json
      - name: Strict Mypy analysis of entire application
        run: python -m mypy --strict --no-incremental aiko_pet main.py tools
