name: Shared room web
on:
  pull_request:
    paths: ['web/**', 'scripts/**', 'aiko_pet/browser/**', 'aiko_pet/frontend/**', '.github/workflows/room-web.yml']
  push:
    branches: [main, feature/shared-room-pwa]
    paths: ['web/**', 'scripts/**', 'aiko_pet/browser/**', 'aiko_pet/frontend/**', '.github/workflows/room-web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web
