[tool.ruff]
target-version = "py311"
line-length = 88
preview = true

[tool.ruff.lint]
# Preview enables Ruff 0.13.2's whitespace and blank-line rules as well.
# Apply the same PEP 8, import-order and naming checks to code and tests.
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.pep8-naming]
# Exact foreign function names used by the Win32 protocol and its test doubles.
extend-ignore-names = [
    "GetAncestor",
    "GetWindow",
    "GetWindowRect",
    "GetWindowLongW",
    "IsWindowVisible",
    "IsIconic",
    "SetWindowPos",
    "GetSystemTimes",
    "GlobalMemoryStatusEx",
]
